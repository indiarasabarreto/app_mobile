databases:
  - name: tasklist_db
    plan: free

services:
  - type: web
    name: task-list-api
    runtime: python
    buildCommand: "./build.sh"
    startCommand: "gunicorn to_do_list_api.wsgi:application"
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: tasklist_db
          property: connectionString
      - key: DJANGO_SETTINGS_MODULE
        value: "to_do_list_api.settings"